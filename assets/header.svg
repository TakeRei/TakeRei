<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-label="Hi, I'm TakeRei - XR Developer / MR x Projection Mapping">
<style>
.font{font-family:'Trebuchet MS','Avenir Next','Segoe UI','Hiragino Maru Gothic ProN',Verdana,sans-serif}
.s1,.s2{animation-timing-function:linear;animation-iteration-count:infinite}
.s1{animation-name:fall1}
.s2{animation-name:fall2}
@keyframes fall1{0%{transform:translate(0,0)}25%{transform:translate(8px,55px)}50%{transform:translate(0,110px)}75%{transform:translate(-8px,165px)}100%{transform:translate(0,220px)}}
@keyframes fall2{0%{transform:translate(0,0)}25%{transform:translate(-7px,55px)}50%{transform:translate(0,110px)}75%{transform:translate(7px,165px)}100%{transform:translate(0,220px)}}
.t1{opacity:0;animation:pop .9s cubic-bezier(.3,1.5,.5,1) .3s forwards}
.t2{opacity:0;animation:pop .9s cubic-bezier(.3,1.5,.5,1) .9s forwards}
.t3{opacity:0;animation:pop .9s cubic-bezier(.3,1.5,.5,1) 1.5s forwards}
@keyframes pop{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
.puff{animation:puff .5s ease-out infinite}
@keyframes puff{0%{opacity:.9;transform:translateX(0)}100%{opacity:0;transform:translateX(-10px)}}
.scarf{animation:flap .4s ease-in-out infinite alternate}
@keyframes flap{to{transform:translateY(-2px)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.wave{transform-box:fill-box;transform-origin:0% 100%;animation:wave .8s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
.sun{animation:glow 5s ease-in-out infinite}
@keyframes glow{50%{opacity:.75}}
</style>
